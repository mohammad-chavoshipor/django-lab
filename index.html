<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="آزمایشگاه حرفه‌ای آموزش جنگو از صفر تا صد، همراه با اسلاید، توضیح کامل، کد، تمرین و پروژه مرحله‌به‌مرحله." />
  <title>آزمایشگاه جنگو | آموزش Django از صفر تا صد</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" title="نمایش/پنهان‌سازی فهرست (T)" aria-label="نمایش یا پنهان‌سازی فهرست">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a class="brand" href="#slide-1">
      <span class="brand-mark">◢</span>
      <span class="brand-text">Django<span class="brand-accent">Lab</span></span>
    </a>
    <div class="topbar-center">
      <div class="progress-track" title="Course progress">
        <div id="progressBar" class="progress-fill"></div>
      </div>
      <span id="progressLabel" class="progress-label">۱ / —</span>
    </div>
    <div class="topbar-right">
      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 2a8 8 0 105.3 14.9l4.4 4.4 1.6-1.6-4.4-4.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
        <input id="searchInput" type="search" placeholder="جست‌وجوی اسلاید..." autocomplete="off" />
      </div>
      <button id="themeToggle" class="icon-btn" title="تغییر تم" aria-label="تغییر تم روشن/تاریک">
        <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20"></svg>
      </button>
      <button id="printBtn" class="icon-btn" title="چاپ یا خروجی PDF" aria-label="چاپ">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 2h12v6h-2V4H8v4H6V2zm12 8H6a2 2 0 00-2 2v5h4v4h8v-4h4v-5a2 2 0 00-2-2zm-2 11H8v-4h8v4z"/></svg>
      </button>
    </div>
  </header>

  <!-- ========== LAYOUT ========== -->
  <div class="layout">
    <!-- TOC sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="فهرست مطالب">
      <nav id="toc" class="toc"></nav>
    </aside>

    <!-- Slide stage -->
    <main class="stage">
      <div class="slide-wrapper">
        <article id="slide" class="slide" tabindex="-1"></article>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="prevBtn" class="ctrl-btn" title="اسلاید قبلی (←)">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          <span>قبلی</span>
        </button>
        <div class="control-center">
          <select id="sectionJump" class="section-jump" title="رفتن به بخش"></select>
          <span id="slideKicker" class="slide-kicker"></span>
        </div>
        <button id="nextBtn" class="ctrl-btn primary" title="اسلاید بعدی (→)">
          <span>بعدی</span>
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8.6 7.4L10 6l6 6-6 6-1.4-1.4L13.2 12z"/></svg>
        </button>
      </div>
    </main>
  </div>

  <!-- ========== FULLSCREEN REVEAL FOR PRINT ========== -->
  <section id="printable" hidden></section>

  <!-- ========== OVERVIEW MODAL ========== -->
  <div id="overview" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card wide">
      <div class="modal-head">
        <h2>نمای کلی دوره</h2>
        <button class="icon-btn" data-close aria-label="بستن">✕</button>
      </div>
      <div class="modal-body">
        <p class="lead">مسیر کامل و مرحله‌به‌مرحله از مفاهیم وب تا ساخت پروژه واقعی <strong>وبلاگ و فروشگاه کوچک</strong> با جنگو.</p>
        <div id="overviewGrid" class="overview-grid"></div>
      </div>
    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <!-- Highlighter must load before slide render -->
  <script src="js/highlight.js"></script>
  <!-- Curriculum, split by part (each pushes into window.SLIDES) -->
  <script src="js/slides/00-foundations.js"></script>
  <script src="js/slides/01-basics.js"></script>
  <script src="js/slides/02-models.js"></script>
  <script src="js/slides/03-views-templates.js"></script>
  <script src="js/slides/04-auth-security.js"></script>
  <script src="js/slides/05-blog-project.js"></script>
  <script src="js/slides/06-advanced.js"></script>
  <!-- Engine -->
  <script src="js/app.js"></script>
</body>
</html>
